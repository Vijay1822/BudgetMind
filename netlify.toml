[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These variables hold non-sensitive configuration (public URLs, identifiers,
  # runtime mode, port, provider name, public Firebase web config), so their
  # values legitimately appear in source, docs, and the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "HINDSIGHT_URL,HINDSIGHT_BANK_ID,NODE_ENV,LLM_PROVIDER,PORT,FIREBASE_PROJECT_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET"
