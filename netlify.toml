[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web SDK config is public by design and is intentionally inlined
  # into the client bundle by Vite. Server-only secrets (FIREBASE_PRIVATE_KEY,
  # SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL, etc.) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"
