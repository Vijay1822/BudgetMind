[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These variables hold non-sensitive configuration (public URLs, identifiers,
  # runtime mode, port, provider name, public Firebase web config — the Firebase web API key, app ID and sender ID
  # are designed to ship in the browser bundle), so their
  # values legitimately appear in source, docs, and the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "HINDSIGHT_URL,HINDSIGHT_BANK_ID,NODE_ENV,LLM_PROVIDER,PORT,FIREBASE_PROJECT_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MESSAGING_SENDER_ID"
  # The public Firebase web API key is embedded in the client config and bundle.
  SECRETS_SCAN_SMART_DETECTION_OMIT_PATHS = "src/services/firebase.ts,dist/assets/*.js"

[functions]
  node_bundler = "esbuild"

# Client-side routing: serve the SPA for any path that isn't a static file or
# a function route (/api/* is handled by netlify/functions/api.mts).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
